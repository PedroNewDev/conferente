services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: conferente
      POSTGRES_PASSWORD: conferente
      POSTGRES_DB: conferente
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conferente"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://conferente:conferente@db:5432/conferente
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./entrada:/app/entrada
      - ./arquivo:/app/arquivo

volumes:
  pgdata:
